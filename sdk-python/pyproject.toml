[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spendveto"
version = "0.2.0"
description = "Dependency-free Python client for SpendVeto: the agent spend-governance proxy and the Governance API"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Proprietary" }
authors = [{ name = "Revanth Rajeev" }]

[project.urls]
Homepage = "https://spendveto.com"

[tool.setuptools]
packages = ["spendveto"]
