[build]
  # site/ is build output: web/ (React + Vite) prerendered to static HTML.
  command = "node scripts/build-site.mjs"
  publish = "site"

# The site loads nothing from anywhere else — no CDN scripts, no external
# stylesheets, no third-party fonts — so the policy can be tight. Every script
# is a built file under /static/ (the only inline <script>s are JSON-LD data,
# which never executes), so script-src is 'self' alone. style-src keeps
# 'unsafe-inline' for the style attributes the markup uses.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self' https://govern.spendveto.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Hashed/immutable assets can be cached hard; HTML must not be.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The policy schema is an open standard: editors, validators and CI fetch it
# from anywhere, so it is served cross-origin with its JSON Schema media type.
[[headers]]
  for = "/schemas/*"
  [headers.values]
    Content-Type = "application/schema+json"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"
