# SpendVeto — the governed API + dashboard (:8402) and the enforcement proxy
# (:8404) as two services sharing one data volume, so keyless agents can POST
# intents to the proxy and the console shows the same ledger.
#
#   docker compose up          # simulate mode, zero setup
#   open http://localhost:8402 # the console
#
# For real x402 on Base Sepolia: set SPENDVETO_MODE=testnet and provide
# SERVER_PAYOUT_ADDRESS / CLIENT_PRIVATE_KEY via an .env file (see .env.example).
services:
  server:
    build: .
    command: ["node", "server/index.js"]
    ports:
      - "8402:8402"
    environment:
      SPENDVETO_MODE: ${SPENDVETO_MODE:-simulate}
    env_file:
      - path: .env.local
        required: false
    volumes:
      - spendveto-data:/app/data

  proxy:
    build: .
    command: ["node", "proxy/server.js"]
    ports:
      - "8404:8404"
    environment:
      SPENDVETO_MODE: ${SPENDVETO_MODE:-simulate}
    env_file:
      - path: .env.local
        required: false
    volumes:
      - spendveto-data:/app/data
    depends_on:
      - server

  # Governance API (/v1, :8405) — reserve-then-settle spend control backed by
  # Postgres. Opt-in so the zero-setup `docker compose up` above is unchanged:
  #
  #   GOVERN_DB_PASSWORD=... docker compose --profile govern up
  #   docker compose exec govern node govern/cli.js create-tenant --name "Acme"
  govern-db:
    image: postgres:16-alpine
    profiles: ["govern"]
    environment:
      POSTGRES_USER: spendveto
      POSTGRES_PASSWORD: ${GOVERN_DB_PASSWORD:-spendveto_dev}
      POSTGRES_DB: spendveto
    volumes:
      - spendveto-govern-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendveto -d spendveto"]
      interval: 5s
      timeout: 3s
      retries: 20

  govern:
    build: .
    profiles: ["govern"]
    command: ["node", "govern/server.js"]
    ports:
      - "8405:8405"
    environment:
      SPENDVETO_DATABASE_URL: postgres://spendveto:${GOVERN_DB_PASSWORD:-spendveto_dev}@govern-db:5432/spendveto
      # cloud = webhook targets on private/loopback addresses are refused.
      # Set self_hosted when the webhook receiver lives on the same network.
      SPENDVETO_DEPLOYMENT: ${SPENDVETO_DEPLOYMENT:-cloud}
    env_file:
      - path: .env.local
        required: false
    depends_on:
      govern-db:
        condition: service_healthy

volumes:
  spendveto-data:
  spendveto-govern-db:
